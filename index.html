  <script>
    /* Dil yönlendirme: ?lang= > kayıtlı tercih > tarayıcı dili > İngilizce */
    (function () {
      var langs = ['tr', 'en', 'fr', 'nl', 'de', 'es'], pick = null;
      try { var q = new URLSearchParams(location.search).get('lang'); if (langs.indexOf(q) > -1) pick = q; } catch (e) {}
      if (!pick) { try { var s = localStorage.getItem('rubix-lang'); if (langs.indexOf(s) > -1) pick = s; } catch (e) {} }
      if (!pick) {
        var list = navigator.languages || [navigator.language || 'en'];
        for (var i = 0; i < list.length && !pick; i++) { var c = String(list[i]).slice(0, 2).toLowerCase(); if (langs.indexOf(c) > -1) pick = c; }
      }
      location.replace((pick || 'en') + '/' + location.hash);
    })();
  </script>
